<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentasi 3D Interaktif - Layout Bangunan CPU KUB Mandiri</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Custom Scrollbar for info drawer */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 9999px;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .label-3d {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 22px rgba(34, 197, 94, 0.85); }
        }
        .flow-badge {
            animation: pulseGlow 2.5s infinite;
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- Main 3D Viewport -->
    <div id="canvas-container"></div>

    <!-- Floating 3D HTML Labels Container -->
    <div id="labels-container" class="fixed inset-0 pointer-events-none overflow-hidden z-10 hidden"></div>

    <!-- Minimalist Floating Reset Button (Top Right) -->
    <div class="fixed top-4 right-4 z-20 flex items-center gap-2">
        <button id="btn-reset-cam" class="glass-panel hover:bg-slate-800/90 active:scale-95 transition rounded-full w-10 h-10 flex items-center justify-center text-slate-200 shadow-xl" title="Reset Sudut Pandang">
            <i class="fa-solid fa-rotate-left text-amber-400 text-sm"></i>
        </button>
    </div>

    <!-- Compact Pop-up Card (Opens ONLY when clicking a room) -->
    <aside id="detail-panel" class="fixed bottom-5 left-1/2 -translate-x-1/2 w-[92%] max-w-md glass-panel rounded-2xl p-4 shadow-2xl z-30 transition-all duration-300 transform translate-y-8 opacity-0 pointer-events-none border border-slate-700/80">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div id="detail-icon-box" class="w-9 h-9 rounded-xl flex items-center justify-center text-white text-sm shadow-md shrink-0">
                    <i id="detail-icon" class="fa-solid fa-cube"></i>
                </div>
                <div class="min-w-0">
                    <span id="detail-step" class="text-[10px] font-bold uppercase tracking-wider text-emerald-400 block truncate">Zona</span>
                    <h2 id="detail-title" class="text-sm font-extrabold text-white truncate">Nama Ruangan</h2>
                </div>
            </div>
            <button id="btn-close-detail" class="w-7 h-7 rounded-full bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition shrink-0">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
        </div>

        <p id="detail-desc" class="mt-2.5 text-slate-300 leading-relaxed text-xs">
            Penjelasan singkat ruangan.
        </p>
    </aside>

    <script>
        // ==========================================
        // 1. DATA SPASIAL & PENJELASAN SINGKAT RUANGAN
        // ==========================================
        const ROOMS_DATA = [
            {
                id: 'halaman_timur',
                name: 'HALAMAN (AKSES MASUK)',
                shortName: 'Halaman Masuk',
                step: 'Zona Eksternal',
                color: 0x94a3b8,
                hex: '#64748b',
                icon: 'fa-truck-ramp-box',
                x: 11.2, z: -0.2, w: 3.6, d: 6.2, h: 0.25,
                desc: 'Area luar sisi timur sebagai jalur bongkar muat bahan baku gula kelapa dari petani menuju pintu penerimaan.'
            },
            {
                id: 'penerimaan',
                name: 'AREA PENERIMAAN BAHAN GULA / BAHAN BAKU',
                shortName: 'Penerimaan Bahan',
                step: 'Tahap 1 • Penerimaan',
                color: 0x93c5fd,
                hex: '#3b82f6',
                icon: 'fa-dolly',
                x: 4.5, z: -2.1, w: 7.4, d: 1.8, h: 1.4,
                desc: 'Tempat penimbangan, pencatatan asal petani (ICS), dan pemeriksaan kualitas awal bahan baku yang baru masuk.'
            },
            {
                id: 'pengayakan',
                name: 'AREA PENGAYAKAN',
                shortName: 'Pengayakan',
                step: 'Tahap 2 • Sortasi Ukuran',
                color: 0xcbd5e1,
                hex: '#64748b',
                icon: 'fa-filter',
                x: -3.2, z: -0.6, w: 3.4, d: 2.2, h: 1.4,
                desc: 'Ruang penyaringan menggunakan mesh food-grade untuk menyeragamkan ukuran butiran gula semut organik.'
            },
            {
                id: 'oven',
                name: 'AREA OVEN',
                shortName: 'Area Oven',
                step: 'Tahap 3 • Pengeringan',
                color: 0xfdba74,
                hex: '#f97316',
                icon: 'fa-fire-burner',
                x: -3.6, z: -2.6, w: 6.4, d: 1.2, h: 1.7,
                extraWing: { x: -6.1, z: -1.0, w: 1.3, d: 2.8, h: 1.7 },
                desc: 'Zona pemanasan berbentuk L untuk menurunkan kadar air gula hingga standar simpan (< 2%) agar tahan lama.'
            },
            {
                id: 'sanitasi',
                name: 'AREA SANITASI',
                shortName: 'Area Sanitasi',
                step: 'Zona Higienitas',
                color: 0x60a5fa,
                hex: '#2563eb',
                icon: 'fa-hands-bubbles',
                x: -0.6, z: -0.6, w: 1.5, d: 2.2, h: 1.4,
                desc: 'Ruang cuci tangan dan sterilisasi pekerja sebelum berpindah dari zona pengolahan menuju ruang pengemasan.'
            },
            {
                id: 'pengemasan',
                name: 'AREA PENGEMASAN',
                shortName: 'Pengemasan',
                step: 'Tahap 4 • Packaging',
                color: 0xfacc15,
                hex: '#eab308',
                icon: 'fa-box-open',
                x: 2.1, z: -0.6, w: 3.2, d: 2.2, h: 1.4,
                desc: 'Ruang bersih untuk penimbangan akhir, penyegelan kemasan kedap udara, dan pelabelan kode batch produk.'
            },
            {
                id: 'transit',
                name: 'AREA TRANSIT BAHAN GULA JADI',
                shortName: 'Transit Gula Jadi',
                step: 'Tahap 5 • Staging',
                color: 0xbef264,
                hex: '#84cc16',
                icon: 'fa-boxes-stacked',
                x: 6.4, z: -0.6, w: 4.8, d: 2.2, h: 1.4,
                desc: 'Area penampungan sementara produk terkemas sebelum dipindahkan lewat koridor ke gudang penyimpanan utama.'
            },
            {
                id: 'penyimpanan',
                name: 'AREA PENYIMPANAN BAHAN GULA JADI',
                shortName: 'Penyimpanan Utama',
                step: 'Tahap 6 • Gudang Akhir',
                color: 0x65a30d,
                hex: '#4d7c0f',
                icon: 'fa-warehouse',
                x: 7.4, z: 3.2, w: 4.6, d: 4.4, h: 1.6,
                extraWing: { x: 10.6, z: 3.2, w: 1.2, d: 4.4, h: 1.6 },
                desc: 'Gudang utama bersuhu dan kelembapan terkontrol untuk menyimpan produk siap kirim dengan akses langsung ke halaman selatan.'
            },
            {
                id: 'istirahat',
                name: 'RUANG ISTIRAHAT KARYAWAN',
                shortName: 'Ruang Istirahat',
                step: 'Fasilitas Pekerja',
                color: 0xfb923c,
                hex: '#ea580c',
                icon: 'fa-mug-hot',
                x: -8.6, z: -1.4, w: 2.8, d: 2.6, h: 1.5,
                extraWing: { x: -7.8, z: -0.2, w: 1.2, d: 1.6, h: 1.5 },
                desc: 'Area istirahat dan loker karyawan di sisi barat yang terpisah penuh dari ruang produksi agar bebas kontaminasi.'
            },
            {
                id: 'toilet',
                name: 'TOILET',
                shortName: 'Toilet',
                step: 'Sanitasi Pekerja',
                color: 0x38bdf8,
                hex: '#0284c7',
                icon: 'fa-restroom',
                x: -9.3, z: 0.1, w: 1.4, d: 1.2, h: 1.5,
                desc: 'Fasilitas toilet karyawan di sudut barat daya yang terisolasi dari ruang pengolahan pangan.'
            }
        ];

        // ==========================================
        // 2. INISIALISASI SCENE THREE.JS
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.014);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
        // Default isometric-like presentation angle
        const defaultCamTarget = new THREE.Vector3(0.5, 0, 0.4);
        let camSpherical = {
            radius: 26,
            theta: 0.22, // horizontal angle
            phi: 0.78    // elevation angle from top
        };

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting Setup (Studio Architectural Look)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(14, 24, 16);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 2;
        dirLight.shadow.camera.far = 60;
        const d = 18;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.35);
        rimLight.position.set(-16, 12, -14);
        scene.add(rimLight);

        // Base Architectural Grid & Plinth
        const gridHelper = new THREE.GridHelper(48, 48, 0x334155, 0x1e293b);
        gridHelper.position.y = -0.15;
        scene.add(gridHelper);

        // Main Building Foundation Slab
        const slabGeo = new THREE.BoxGeometry(24.5, 0.2, 11.5);
        const slabMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
        const slabMesh = new THREE.Mesh(slabGeo, slabMat);
        slabMesh.position.set(1.2, -0.05, 0.8);
        slabMesh.receiveShadow = true;
        scene.add(slabMesh);

        // Halaman Selatan Slab (per visual reference)
        const halamanSelatanGeo = new THREE.BoxGeometry(9.6, 0.24, 1.8);
        const halamanSelatanMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.85 });
        const halamanSelatan = new THREE.Mesh(halamanSelatanGeo, halamanSelatanMat);
        halamanSelatan.position.set(8.2, 0.08, 6.4);
        halamanSelatan.receiveShadow = true;
        scene.add(halamanSelatan);

        // ==========================================
        // 3. MEMBANGUN MODEL 3D RUANGAN & INTERAKSI
        // ==========================================
        const interactiveMeshes = [];
        const roomObjectsMap = new Map();
        const labelsContainer = document.getElementById('labels-container');
        const labelElements = [];

        function createRoomBlock(roomData, partConfig, isPrimary) {
            const { x, z, w, d, h } = partConfig;
            const geometry = new THREE.BoxGeometry(w, h, d);
            const material = new THREE.MeshStandardMaterial({
                color: roomData.color,
                roughness: 0.38,
                metalness: 0.08,
                transparent: true,
                opacity: 0.92
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, h / 2 + 0.05, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { roomId: roomData.id, baseY: h / 2 + 0.05, baseColor: roomData.color };

            // Crisp Architectural Edges
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
            const wireframe = new THREE.LineSegments(edges, lineMat);
            mesh.add(wireframe);

            scene.add(mesh);
            interactiveMeshes.push(mesh);

            if (!roomObjectsMap.has(roomData.id)) {
                roomObjectsMap.set(roomData.id, []);
            }
            roomObjectsMap.get(roomData.id).push(mesh);

            // Create Floating HTML Label for Primary Block
            if (isPrimary) {
                const labelDiv = document.createElement('div');
                labelDiv.className = 'label-3d px-2.5 py-1 rounded-lg bg-slate-950/80 border border-slate-700/80 text-[10px] sm:text-xs font-bold text-white whitespace-nowrap shadow-md';
                labelDiv.innerHTML = `<span class="inline-block w-2 h-2 rounded-full mr-1.5" style="background:${roomData.hex}"></span>${roomData.shortName}`;
                labelsContainer.appendChild(labelDiv);

                labelElements.push({
                    el: labelDiv,
                    pos: new THREE.Vector3(x, h + 0.65, z),
                    roomId: roomData.id
                });
            }
        }

        ROOMS_DATA.forEach(room => {
            createRoomBlock(room, room, true);
            if (room.extraWing) {
                createRoomBlock(room, room.extraWing, false);
            }
        });

        // Add Architectural Door Thresholds (Pintu Akses)
        const doorPositions = [
            { x: 9.2, z: -2.1, rot: Math.PI / 2 },  // Pintu Masuk Timur ke Penerimaan
            { x: -7.0, z: -1.4, rot: Math.PI / 2 }, // Pintu Ruang Istirahat
            { x: 0.3, z: -2.1, rot: Math.PI / 2 },  // Pintu Area Penerimaan ke Produksi
            { x: 9.6, z: 0.8, rot: 0 },             // Pintu Masuk Koridor Gudang Utara
            { x: 9.6, z: 5.5, rot: 0 }              // Pintu Keluar Gudang Selatan ke Halaman
        ];
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.4 });
        doorPositions.forEach(dp => {
            const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.25, 0.22), doorMat);
            doorMesh.position.set(dp.x, 0.15, dp.z);
            doorMesh.rotation.y = dp.rot;
            scene.add(doorMesh);
        });

        // ==========================================
        // 4. ANIMASI ALUR PERGERAKAN MATERIAL (3D FLOW)
        // ==========================================
        const flowGroup = new THREE.Group();
        scene.add(flowGroup);

        // Paths matching the green arrows in the architectural diagram
        const flowPaths = [
            // 1. Halaman Timur -> Area Penerimaan
            [new THREE.Vector3(10.5, 1.65, -2.1), new THREE.Vector3(8.2, 1.65, -2.1)],
            // 2. Area Penerimaan -> Area Pengayakan
            [new THREE.Vector3(0.8, 1.65, -2.0), new THREE.Vector3(-2.6, 1.65, -2.0), new THREE.Vector3(-2.6, 1.65, -1.5)],
            // 3. Area Pengayakan <-> Area Oven (Utara & Barat)
            [new THREE.Vector3(-3.2, 1.65, -1.6), new THREE.Vector3(-3.2, 1.85, -2.3)],
            [new THREE.Vector3(-5.1, 1.65, -2.0), new THREE.Vector3(-3.7, 1.65, -2.0), new THREE.Vector3(-3.7, 1.65, -1.5)],
            // 4. Area Pengayakan/Oven -> Area Pengemasan
            [new THREE.Vector3(-2.1, 1.65, -1.7), new THREE.Vector3(1.8, 1.65, -1.5), new THREE.Vector3(1.8, 1.65, -1.2)],
            // 5. Area Pengemasan -> Area Transit Bahan Gula Jadi
            [new THREE.Vector3(2.5, 1.65, -1.2), new THREE.Vector3(2.5, 1.65, -1.6), new THREE.Vector3(6.2, 1.65, -1.6), new THREE.Vector3(6.2, 1.65, -1.2)],
            // 6. Area Transit -> Koridor -> Area Penyimpanan Bahan Gula Jadi
            [new THREE.Vector3(8.5, 1.65, -1.3), new THREE.Vector3(9.6, 1.65, -1.6), new THREE.Vector3(9.6, 1.65, 3.8)]
        ];

        const flowParticles = [];
        const tubeMaterial = new THREE.MeshStandardMaterial({
            color: 0x10b981,
            emissive: 0x059669,
            emissiveIntensity: 0.45,
            roughness: 0.2
        });

        flowPaths.forEach(points => {
            const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.15);
            const tubeGeo = new THREE.TubeGeometry(curve, 32, 0.08, 8, false);
            const tubeMesh = new THREE.Mesh(tubeGeo, tubeMaterial);
            flowGroup.add(tubeMesh);

            // Cone arrowhead at the end of each segment
            const endPt = curve.getPoint(1);
            const tangent = curve.getTangent(1).normalize();
            const coneGeo = new THREE.ConeGeometry(0.22, 0.45, 12);
            const coneMesh = new THREE.Mesh(coneGeo, tubeMaterial);
            coneMesh.position.copy(endPt);
            coneMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
            flowGroup.add(coneMesh);

            // Moving glowing spheres along the curve
            for (let i = 0; i < 2; i++) {
                const pGeo = new THREE.SphereGeometry(0.16, 12, 12);
                const pMat = new THREE.MeshBasicMaterial({ color: 0xa7f3d0 });
                const pMesh = new THREE.Mesh(pGeo, pMat);
                flowGroup.add(pMesh);
                flowParticles.push({
                    mesh: pMesh,
                    curve: curve,
                    progress: i * 0.5,
                    speed: 0.0065
                });
            }
        });

        // ==========================================
        // 5. KONTROL KAMERA ORBIT & SENTUHAN (TOUCH/MOUSE)
        // ==========================================
        let currentTarget = defaultCamTarget.clone();
        let desiredTarget = defaultCamTarget.clone();
        let desiredSpherical = { ...camSpherical };

        let isDragging = false;
        let prevPointer = { x: 0, y: 0 };
        let pointerDownPos = { x: 0, y: 0 };
        let initialPinchDist = null;

        function updateCameraPosition() {
            // Smooth interpolation
            camSpherical.radius += (desiredSpherical.radius - camSpherical.radius) * 0.12;
            camSpherical.theta += (desiredSpherical.theta - camSpherical.theta) * 0.12;
            camSpherical.phi += (desiredSpherical.phi - camSpherical.phi) * 0.12;
            currentTarget.lerp(desiredTarget, 0.12);

            const sinPhiRadius = camSpherical.radius * Math.sin(camSpherical.phi);
            camera.position.x = currentTarget.x + sinPhiRadius * Math.sin(camSpherical.theta);
            camera.position.y = currentTarget.y + camSpherical.radius * Math.cos(camSpherical.phi);
            camera.position.z = currentTarget.z + sinPhiRadius * Math.cos(camSpherical.theta);
            camera.lookAt(currentTarget);
        }

        // Mouse Events
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevPointer = { x: e.clientX, y: e.clientY };
            pointerDownPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            handleHover(e.clientX, e.clientY);
            if (!isDragging) return;
            const dx = e.clientX - prevPointer.x;
            const dy = e.clientY - prevPointer.y;
            desiredSpherical.theta -= dx * 0.007;
            desiredSpherical.phi = Math.max(0.2, Math.min(1.42, desiredSpherical.phi - dy * 0.007));
            prevPointer = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (moveDist < 6) {
                handleSelectAt(e.clientX, e.clientY);
            }
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            desiredSpherical.radius = Math.max(10, Math.min(42, desiredSpherical.radius + e.deltaY * 0.015));
        }, { passive: false });

        // Touch Events (Swipe & Pinch Zoom)
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                pointerDownPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const dx = e.touches[0].clientX - prevPointer.x;
                const dy = e.touches[0].clientY - prevPointer.y;
                desiredSpherical.theta -= dx * 0.008;
                desiredSpherical.phi = Math.max(0.2, Math.min(1.42, desiredSpherical.phi - dy * 0.008));
                prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2 && initialPinchDist) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const diff = initialPinchDist - currentDist;
                desiredSpherical.radius = Math.max(10, Math.min(42, desiredSpherical.radius + diff * 0.04));
                initialPinchDist = currentDist;
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1 && isDragging) {
                const touch = e.changedTouches[0];
                const moveDist = Math.hypot(touch.clientX - pointerDownPos.x, touch.clientY - pointerDownPos.y);
                if (moveDist < 10) {
                    handleSelectAt(touch.clientX, touch.clientY);
                }
            }
            isDragging = false;
            initialPinchDist = null;
        });

        // ==========================================
        // 6. RAYCASTING (KLIK & HOVER SETIAP RUANGAN)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();
        let hoveredRoomId = null;
        let selectedRoomId = null;

        function getIntersectedRoomId(clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointerNDC, camera);
            const hits = raycaster.intersectObjects(interactiveMeshes, false);
            return hits.length > 0 ? hits[0].object.userData.roomId : null;
        }

        function handleHover(clientX, clientY) {
            const id = getIntersectedRoomId(clientX, clientY);
            hoveredRoomId = id;
            renderer.domElement.style.cursor = id ? 'pointer' : (isDragging ? 'grabbing' : 'grab');
        }

        function handleSelectAt(clientX, clientY) {
            const id = getIntersectedRoomId(clientX, clientY);
            if (id) {
                selectRoom(id);
            } else {
                closeDetailPanel();
            }
        }

        // ==========================================
        // 7. UI & LOGIKA PRESENTASI RUANGAN
        // ==========================================
        const detailPanel = document.getElementById('detail-panel');

        function selectRoom(roomId) {
            const roomIndex = ROOMS_DATA.findIndex(r => r.id === roomId);
            if (roomIndex === -1) return;
            const room = ROOMS_DATA[roomIndex];
            selectedRoomId = roomId;

            // Smoothly focus camera on selected room
            desiredTarget.set(room.x, 0.5, room.z);
            desiredSpherical.radius = 16.5;

            // Populate Compact Pop-up Card
            document.getElementById('detail-step').textContent = room.step;
            document.getElementById('detail-title').textContent = room.name;
            document.getElementById('detail-desc').textContent = room.desc;

            const iconBox = document.getElementById('detail-icon-box');
            iconBox.style.backgroundColor = room.hex;
            document.getElementById('detail-icon').className = `fa-solid ${room.icon}`;

            // Show panel
            detailPanel.classList.remove('translate-y-8', 'opacity-0', 'pointer-events-none');
            detailPanel.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
        }

        function closeDetailPanel() {
            selectedRoomId = null;
            detailPanel.classList.add('translate-y-8', 'opacity-0', 'pointer-events-none');
            detailPanel.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
        }

        document.getElementById('btn-close-detail').addEventListener('click', closeDetailPanel);

        document.getElementById('btn-reset-cam').addEventListener('click', () => {
            closeDetailPanel();
            desiredTarget.copy(defaultCamTarget);
            desiredSpherical = { radius: 26, theta: 0.22, phi: 0.78 };
        });

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                const idx = ROOMS_DATA.findIndex(r => r.id === selectedRoomId);
                const nextIdx = (idx + 1) % ROOMS_DATA.length;
                selectRoom(ROOMS_DATA[nextIdx].id);
            } else if (e.key === 'ArrowLeft') {
                const idx = ROOMS_DATA.findIndex(r => r.id === selectedRoomId);
                const prevIdx = (idx - 1 + ROOMS_DATA.length) % ROOMS_DATA.length;
                selectRoom(ROOMS_DATA[prevIdx].id);
            } else if (e.key === 'Escape') {
                closeDetailPanel();
            }
        });

        // ==========================================
        // 8. LOOP ANIMASI
        // ==========================================
        const flowVisible = true;
        const labelsVisible = false;

        function update3DLabels() {
            if (!labelsVisible) return;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Animate room elevation & highlight on hover/selection
            roomObjectsMap.forEach((meshes, roomId) => {
                const isSelected = roomId === selectedRoomId;
                const isHovered = roomId === hoveredRoomId;
                const targetYOffset = isSelected ? 0.35 : (isHovered ? 0.18 : 0);

                meshes.forEach(mesh => {
                    const targetY = mesh.userData.baseY + targetYOffset;
                    mesh.position.y += (targetY - mesh.position.y) * 0.15;

                    if (isSelected) {
                        mesh.material.emissive.setHex(0x10b981);
                        mesh.material.emissiveIntensity = 0.28;
                    } else if (isHovered) {
                        mesh.material.emissive.setHex(0xffffff);
                        mesh.material.emissiveIntensity = 0.15;
                    } else {
                        mesh.material.emissive.setHex(0x000000);
                        mesh.material.emissiveIntensity = 0;
                    }
                });
            });

            // Animate material flow particles
            if (flowVisible) {
                flowParticles.forEach(p => {
                    p.progress = (p.progress + p.speed) % 1;
                    const pt = p.curve.getPoint(p.progress);
                    p.mesh.position.copy(pt);
                });
            }

            updateCameraPosition();
            update3DLabels();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
